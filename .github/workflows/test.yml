name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.25', 'stable']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: go build ./...
      - run: go vet ./...
      # Unit tests only; the network tests (bootstrapping real Tor) are slow and
      # are skipped by -short. Run `go test` locally to exercise them.
      - run: go test -short ./...
